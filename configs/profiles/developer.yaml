name: developer
description: Software Developer Persona
web_browsing:
    enabled: true
    requests_per_minute_min: 6
    requests_per_minute_max: 20
    dwell_time_min_sec: 4
    dwell_time_max_sec: 16
    fetch_assets: true
    user_agents: []
    target_urls:
        - https://github.com/trending
        - https://stackoverflow.com/questions
    search_keywords:
        - go concurrency
        - docker multistage
file_share:
    enabled: true
    interval_sec: 25
    shares: []
    read_ratio: 0.7
    write_ratio: 0.3
ping:
    enabled: false
    interval_sec: 0
    targets: []
host_activity:
    enabled: true
    interval_sec: 15
    safe_processes:
        - whoami
        - git --version
        - hostname
    simulate_office_docs: false
    temp_file_operations: true
