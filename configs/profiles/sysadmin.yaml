name: "sysadmin"
description: "Simulates IT / Range administrator performing network diagnostics, querying servers, and auditing shared storage."

web_browsing:
  enabled: true
  requests_per_minute_min: 5
  requests_per_minute_max: 15
  dwell_time_min_sec: 4
  dwell_time_max_sec: 20
  fetch_assets: false
  target_urls:
    - "http://portal.range.local"
    - "https://docs.netgate.com/pfsense/en/latest/"
    - "https://learn.microsoft.com/en-us/windows-server/"
  search_keywords:
    - "pfsense gateway routing table troubleshooting"
    - "active directory replication error 1722"
    - "event log id 4625 brute force analysis"

file_share:
  enabled: true
  interval_sec: 15
  read_ratio: 0.60
  write_ratio: 0.40

host_activity:
  enabled: true
  interval_sec: 15
  safe_processes:
    - "netstat -rn"
    - "hostname"
    - "uptime"
  simulate_office_docs: false
  temp_file_operations: true
