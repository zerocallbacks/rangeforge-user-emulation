name: Continuous Integration

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.24']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Test Suite
        run: go test -v -timeout 10m ./...

  cross-compile:
    name: Verify Multi-Platform Builds
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: -linux-amd64
          - os: linux
            arch: arm64
            suffix: -linux-arm64
          - os: windows
            arch: amd64
            suffix: -windows-amd64.exe
          - os: freebsd
            arch: amd64
            suffix: -freebsd-amd64
          - os: darwin
            arch: amd64
            suffix: -darwin-amd64
          - os: darwin
            arch: arm64
            suffix: -darwin-arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: Compile Binary (${{ matrix.os }}/${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w -X 'rangeforge-ue/pkg/branding.Version=ci-${{ github.sha }}'" \
            -o dist/rangeforge-ue${{ matrix.suffix }} ./cmd/rangeforge-ue
