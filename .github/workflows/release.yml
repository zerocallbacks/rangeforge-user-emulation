name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Extract Release Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Compile Multi-Platform Binaries
        env:
          CGO_ENABLED: 0
          VER: ${{ steps.get_version.outputs.VERSION }}
        run: |
          mkdir -p release_assets
          
          LDFLAGS="-s -w -X 'rangeforge-ue/pkg/branding.Version=${VER}'"

          echo "Building Windows amd64..."
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o release_assets/rangeforge-ue-windows-amd64.exe ./cmd/rangeforge-ue

          echo "Building Windows arm64..."
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o release_assets/rangeforge-ue-windows-arm64.exe ./cmd/rangeforge-ue

          echo "Building Linux amd64..."
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o release_assets/rangeforge-ue-linux-amd64 ./cmd/rangeforge-ue

          echo "Building Linux arm64..."
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o release_assets/rangeforge-ue-linux-arm64 ./cmd/rangeforge-ue

          echo "Building FreeBSD amd64 (pfSense / OPNsense)..."
          GOOS=freebsd GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o release_assets/rangeforge-ue-freebsd-amd64 ./cmd/rangeforge-ue

          echo "Building macOS amd64..."
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o release_assets/rangeforge-ue-darwin-amd64 ./cmd/rangeforge-ue

          echo "Building macOS arm64 (Apple Silicon)..."
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o release_assets/rangeforge-ue-darwin-arm64 ./cmd/rangeforge-ue

      - name: Generate SHA-256 Checksums
        working-directory: release_assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
